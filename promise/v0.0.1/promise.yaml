apiVersion: platform.kratix.io/v1alpha1
kind: Promise
metadata:
  creationTimestamp: null
  labels:
    kratix.io/promise-version: v0.0.1
  name: database
spec:
  api:
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      creationTimestamp: null
      name: databases.demo.cloudnativedaysitaly.org
    spec:
      group: demo.cloudnativedaysitaly.org
      names:
        kind: Database
        plural: databases
        singular: database
      scope: Namespaced
      versions:
      - name: v1alpha1
        schema:
          openAPIV3Schema:
            properties:
              spec:
                properties:
                  size:
                    enum:
                    - small
                    - large
                    type: string
                  environment_type:
                    enum:
                    - dev
                    - prod
                    type: string
                  postgresql_version:
                    type: integer
                    enum:
                    - 15
                    - 16
                    - 17
                    default: 17
                  backup_enabled:
                    type: string
                    enum:
                    - "true"
                    - "false"
                    default: "false"
                required:
                - size
                - environment_type
                type: object
            type: object
        served: true
        storage: true
    status:
      acceptedNames:
        kind: ""
        plural: ""
      conditions: null
      storedVersions: null
  workflows:
    config: {}
    promise:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          creationTimestamp: null
          name: dependencies
        spec:
          containers:
          - image: cpng-database-promise-pipeline:v0.0.1
            name: configure-deps
          jobOptions: {}
          rbac: {}
    resource:
      configure:
      - apiVersion: platform.kratix.io/v1alpha1
        kind: Pipeline
        metadata:
          name: database-configure
        spec:
          containers:
          - image: cpng-database-resource-pipeline:v0.0.1
            name: cpng-database-resource-pipeline
  # Destination selectors are set dynamically by the pipeline
  # based on spec.environment_type (dev or prod)
status:
  workflows: 0
  workflowsFailed: 0
  workflowsSucceeded: 0
